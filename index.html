<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سوییچ به سوییچ | معاوضه آسان و سریع خودرو</title>

<style>
*{
  box-sizing:border-box;
  font-family:Tahoma,Arial,sans-serif;
}

body{
  margin:0;
  background:#f4f8fc;
  color:#172b4d;
}

header{
  background:linear-gradient(135deg,#0b2d52,#168bd1);
  color:white;
  text-align:center;
  padding:35px 15px;
}

.logo{
  font-size:32px;
  font-weight:bold;
}

.subtitle{
  margin-top:10px;
  font-size:16px;
}

.slogan{
  margin-top:15px;
  font-weight:bold;
  letter-spacing:2px;
}

.container{
  max-width:850px;
  margin:25px auto;
  padding:15px;
}

.card{
  background:white;
  border-radius:18px;
  padding:25px;
  margin-bottom:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.07);
}

h2{
  margin-top:0;
  color:#0b4d7d;
}

.choice{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.choice button{
  border:2px solid #168bd1;
  background:white;
  color:#0b4d7d;
  padding:20px;
  border-radius:15px;
  font-size:18px;
  cursor:pointer;
}

.choice button:hover{
  background:#168bd1;
  color:white;
}

label{
  display:block;
  margin:13px 0 6px;
  font-weight:bold;
}

input,select,textarea{
  width:100%;
  padding:13px;
  border:1px solid #ccd8e5;
  border-radius:10px;
  font-size:15px;
  background:white;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.hidden{
  display:none;
}

.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
  margin-top:15px;
}

.day{
  padding:12px 5px;
  background:#eef5fa;
  border-radius:8px;
  text-align:center;
  cursor:pointer;
}

.day:hover,
.day.selected{
  background:#168bd1;
  color:white;
}

.times{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:15px;
}

.time{
  padding:10px 15px;
  border:1px solid #168bd1;
  background:white;
  color:#0b4d7d;
  border-radius:8px;
  cursor:pointer;
}

.time:hover,
.time.selected{
  background:#168bd1;
  color:white;
}

.time:disabled{
  background:#ddd;
  border-color:#ddd;
  color:#888;
  cursor:not-allowed;
}

.submit{
  width:100%;
  border:0;
  background:linear-gradient(135deg,#0b4d7d,#168bd1);
  color:white;
  padding:16px;
  border-radius:12px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  margin-top:20px;
}

.submit:disabled{
  opacity:.6;
}

.success{
  text-align:center;
  background:#eaf8f0;
  border:1px solid #8bd0a7;
  padding:25px;
  border-radius:15px;
}

.tracking{
  font-size:24px;
  font-weight:bold;
  color:#087443;
  margin:15px 0;
}

.error{
  background:#fff0f0;
  color:#a00000;
  padding:15px;
  border-radius:10px;
  margin-top:15px;
  display:none;
}

@media(max-width:600px){
  .grid,
  .choice{
    grid-template-columns:1fr;
  }

  .logo{
    font-size:27px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">سوییچ به سوییچ</div>
  <div class="subtitle">معاوضه آسان و سریع خودرو با امنیت و شفافیت</div>
  <div class="slogan">سرعت • امنیت • شفافیت</div>
</header>

<div class="container">

  <div class="card" id="typeCard">
    <h2>نوع درخواست</h2>

    <div class="choice">
      <button onclick="chooseType('فروش خودرو')">
        🚘 فروش خودرو
      </button>

      <button onclick="chooseType('معاوضه خودرو')">
        🔄 معاوضه خودرو
      </button>
    </div>
  </div>

  <div class="card hidden" id="formCard">

    <h2>اطلاعات خودرو</h2>

    <div class="grid">

      <div>
        <label>نام و نام خانوادگی</label>
        <input id="name" type="text">
      </div>

      <div>
        <label>شماره تماس</label>
        <input id="phone" type="tel">
      </div>

      <div>
        <label>برند خودرو</label>
        <select id="brand" onchange="loadModels()">
          <option value="">انتخاب کنید</option>
          <option>ایران خودرو</option>
          <option>سایپا</option>
          <option>کرمان موتور</option>
          <option>مدیران خودرو</option>
          <option>بهمن موتور</option>
          <option>فونیکس</option>
          <option>چری</option>
          <option>کیا</option>
          <option>هیوندای</option>
          <option>تویوتا</option>
          <option>بنز</option>
          <option>بی ام و</option>
          <option>سایر</option>
        </select>
      </div>

      <div>
        <label>مدل خودرو</label>
        <input id="model" type="text">
      </div>

      <div>
        <label>تیپ</label>
        <input id="trim" type="text">
      </div>

      <div>
        <label>سال ساخت</label>
        <input id="year" type="text">
      </div>

      <div>
        <label>کارکرد</label>
        <input id="km" type="text" placeholder="مثلاً 85000" oninput="formatKm(this)">
      </div>

      <div>
        <label>رنگ</label>
        <input id="color" type="text">
      </div>

      <div>
        <label>پلاک</label>
        <input id="plate" type="text">
      </div>

    </div>

    <label>وضعیت خودرو / توضیحات</label>
    <textarea id="description" placeholder="توضیحات خودرو، وضعیت بدنه، فنی و موارد مهم..."></textarea>

    <div id="exchangeSection" class="hidden">

      <h2 style="margin-top:30px">خودروی موردنظر برای معاوضه</h2>

      <label>خودروی موردنظر</label>
      <input id="desiredVehicle" type="text" placeholder="مثلاً پژو 207 اتومات">

      <label>بودجه یا مابه‌التفاوت موردنظر</label>
      <input id="exchangeBudget" type="text" placeholder="مثلاً 500 میلیون تومان">

    </div>

    <h2 style="margin-top:30px">انتخاب زمان کارشناسی</h2>

    <label>تاریخ</label>
    <div class="calendar" id="calendar"></div>

    <input type="hidden" id="selectedDate">

    <label style="margin-top:20px">ساعت</label>

    <div class="times">
      <button class="time" onclick="selectTime(this,'09:00')">09:00</button>
      <button class="time" onclick="selectTime(this,'10:00')">10:00</button>
      <button class="time" onclick="selectTime(this,'11:00')">11:00</button>
      <button class="time" onclick="selectTime(this,'12:00')">12:00</button>
      <button class="time" onclick="selectTime(this,'13:00')">13:00</button>
      <button class="time" disabled>14:00</button>
      <button class="time" onclick="selectTime(this,'15:00')">15:00</button>
      <button class="time" onclick="selectTime(this,'16:00')">16:00</button>
      <button class="time" onclick="selectTime(this,'17:00')">17:00</button>
    </div>

    <input type="hidden" id="selectedTime">

    <div class="error" id="errorBox"></div>

    <button class="submit" id="submitBtn" onclick="submitRequest()">
      ثبت درخواست
    </button>

  </div>

  <div class="card hidden" id="successCard">

    <div class="success">

      <h2>درخواست شما با موفقیت ثبت شد ✅</h2>

      <p>کد پیگیری درخواست شما:</p>

      <div class="tracking" id="tracking"></div>

      <p id="doneType"></p>
      <p id="doneDate"></p>
      <p id="doneTime"></p>

      <p>
        کارشناسان سوییچ به سوییچ در اولین فرصت با شما تماس خواهند گرفت.
      </p>

    </div>

  </div>

</div>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://tgdbrchbbuakmymogyuh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Y2aWeXKDVMp5tS-RF4emSw_Jt0OExjH";


/* =========================
   VARIABLES
========================= */

let requestType = "";
let selectedDate = "";
let selectedTime = "";


/* =========================
   CHOOSE TYPE
========================= */

function chooseType(type){

  requestType = type;

  document.getElementById("typeCard").classList.add("hidden");
  document.getElementById("formCard").classList.remove("hidden");

  if(type === "معاوضه خودرو"){
    document.getElementById("exchangeSection").classList.remove("hidden");
  }else{
    document.getElementById("exchangeSection").classList.add("hidden");
  }

  generateCalendar();
}


/* =========================
   MODELS
========================= */

function loadModels(){
  // فعلاً مدل‌ها دستی وارد می‌شوند.
}


/* =========================
   FORMAT KM
========================= */

function formatKm(input){

  let value = input.value.replace(/\D/g,'');

  if(value){
    input.value = Number(value).toLocaleString('en-US');
  }
}


/* =========================
   CALENDAR
========================= */

function generateCalendar(){

  const calendar = document.getElementById("calendar");

  calendar.innerHTML = "";

  const today = new Date();

  for(let i = 0; i < 14; i++){

    const date = new Date(today);
    date.setDate(today.getDate() + i);

    const day = document.createElement("div");

    day.className = "day";

    const dateText =
      date.getFullYear() + "-" +
      String(date.getMonth()+1).padStart(2,"0") + "-" +
      String(date.getDate()).padStart(2,"0");

    day.innerHTML =
      date.toLocaleDateString("fa-IR",{
        month:"short",
        day:"numeric"
      });

    day.onclick = function(){

      document.querySelectorAll(".day")
        .forEach(x => x.classList.remove("selected"));

      day.classList.add("selected");

      selectedDate = dateText;

      document.getElementById("selectedDate").value =
        selectedDate;
    };

    calendar.appendChild(day);
  }
}


/* =========================
   TIME
========================= */

function selectTime(button,time){

  document.querySelectorAll(".time")
    .forEach(x => x.classList.remove("selected"));

  button.classList.add("selected");

  selectedTime = time;

  document.getElementById("selectedTime").value =
    selectedTime;
}


/* =========================
   TRACKING CODE
========================= */

function generateTracking(){

  return "STW-" +
    Math.floor(10000 + Math.random() * 90000);

}


/* =========================
   SUBMIT
========================= */

async function submitRequest(){

  const errorBox =
    document.getElementById("errorBox");

  const submitBtn =
    document.getElementById("submitBtn");

  errorBox.style.display = "none";

  const name =
    document.getElementById("name").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  const brand =
    document.getElementById("brand").value;

  const model =
    document.getElementById("model").value.trim();

  const trim =
    document.getElementById("trim").value.trim();

  const year =
    document.getElementById("year").value.trim();

  const km =
    document.getElementById("km").value.trim();

  const color =
    document.getElementById("color").value.trim();

  const plate =
    document.getElementById("plate").value.trim();

  const description =
    document.getElementById("description").value.trim();

  const desiredVehicle =
    document.getElementById("desiredVehicle")
      ? document.getElementById("desiredVehicle").value.trim()
      : "";

  const exchangeBudget =
    document.getElementById("exchangeBudget")
      ? document.getElementById("exchangeBudget").value.trim()
      : "";


  /* validation */

  if(!name || !phone || !brand || !model){

    errorBox.innerText =
      "لطفاً اطلاعات اصلی خودرو و شماره تماس را کامل کنید.";

    errorBox.style.display = "block";

    return;
  }

  if(!selectedDate){

    errorBox.innerText =
      "لطفاً تاریخ کارشناسی را انتخاب کنید.";

    errorBox.style.display = "block";

    return;
  }

  if(!selectedTime){

    errorBox.innerText =
      "لطفاً ساعت کارشناسی را انتخاب کنید.";

    errorBox.style.display = "block";

    return;
  }


  /* tracking */

  const trackingCode =
    generateTracking();


  /* DATABASE DATA */

  const data = {

    tracking_code: trackingCode,

    request_type: requestType,

    customer_name: name,

    customer_phone: phone,

    vehicle_brand: brand,

    vehicle_model: model,

    vehicle_trim: trim,

    vehicle_year: year,

    mileage: km,

    vehicle_color: color,

    plate: plate,

    description: description,

    desired_vehicle:
      desiredVehicle,

    exchange_budget:
      exchangeBudget,

    appointment_date:
      selectedDate,

    appointment_time:
      selectedTime,

    status:
      "در انتظار بررسی"

  };


  submitBtn.disabled = true;

  submitBtn.innerText =
    "در حال ثبت درخواست...";


  try{

    const response = await fetch(
      SUPABASE_URL + "/rest/v1/requests",
      {
        method:"POST",

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer " + SUPABASE_KEY,
          "Content-Type":"application/json",
          "Prefer":"return=minimal"
        },

        body:JSON.stringify(data)
      }
    );


    if(!response.ok){

      const errorText =
        await response.text();

      console.log("SUPABASE ERROR:",errorText);

      throw new Error(errorText);
    }


    /* SUCCESS */

    document.getElementById("formCard")
      .classList.add("hidden");

    document.getElementById("successCard")
      .classList.remove("hidden");

    document.getElementById("tracking").innerText =
      trackingCode;

    document.getElementById("doneType").innerText =
      "نوع درخواست: " + requestType;

    document.getElementById("doneDate").innerText =
      "تاریخ کارشناسی: " + selectedDate;

    document.getElementById("doneTime").innerText =
      "ساعت کارشناسی: " + selectedTime;


  }catch(error){

    console.error(error);

    errorBox.innerText =
      "ثبت درخواست انجام نشد. لطفاً دوباره تلاش کنید.";

    errorBox.style.display = "block";

    submitBtn.disabled = false;

    submitBtn.innerText =
      "ثبت درخواست";
  }

}


/* =========================
   START
========================= */

</script>

</body>
</html>
